name: wasl_app
description: A new Flutter project.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
version: 1.0.0+1

# Lower bound taken from pubspec.lock, which records what the existing
# resolution actually needs (dart ">=3.9.0-0 <4.0.0"). With no constraint here
# at all, pub refuses to resolve rather than guessing one.
environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # These four are imported across lib/ but were absent from this file, so the
  # project resolved and then failed to compile. The versions are the ones
  # already pinned in pubspec.lock, so restoring them resolves to exactly the
  # packages this tree was built against — nothing is upgraded here.
  cupertino_icons: ^1.0.8
  dio: ^5.9.2 # lib/core/network/api_client.dart
  flutter_svg: ^2.0.10+1 # icons and illustrations
  form_field_validator: ^1.1.0 # sign-in and sign-up validation

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/Illustrations/
    - assets/icons/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # The theme asks for "SF Pro Text" by name and the files were in the
  # repository, but no fonts section declared them — so every screen fell back
  # to the platform default. The layout was right and the typeface was not,
  # which is the kind of bug that gets read as a design choice.
  fonts:
    - family: SF Pro Text
      fonts:
        - asset: assets/font/SF Pro Text/SFProText-Regular.ttf
          weight: 400
        - asset: assets/font/SF Pro Text/SFProText-Medium.ttf
          weight: 500
        - asset: assets/font/SF Pro Text/SFProText-Semibold.ttf
          weight: 600
        - asset: assets/font/SF Pro Text/SFProText-Bold.ttf
          weight: 700
