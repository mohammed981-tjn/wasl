name: wasl
description: "وصل — منصّة تشغيل مغاسل وتوصيل"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # تنسيق الأرقام والتواريخ والعملة بحسب اللغة — «١٥ ر.س» و«SAR 15» ناتجا
  # تنسيقين لا كتابتان لنصّ واحد.
  intl: any

  # الخادم: Postgres ومصادقة وتتبّع حيّ وتخزين. الرابط والمفتاح المنشور ليسا
  # سرّين؛ كلّ التحكّم عبر RLS.
  supabase_flutter: ^2.8.0

  # إدارة الحالة — النمط نفسه المستعمل في zadgo2، فالانتقال بين المشروعين
  # لا يحتاج إعادة تعلّم.
  provider: ^6.1.2

  # رسوم لوحة الإدارة
  fl_chart: ^0.69.0

  # يُستعمل لالتقاط ClientException وحدها في مترجم الأخطاء — و supabase_flutter
  # يعتمدها أصلًا، فالإعلان عنها صريحًا لا يضيف حزمة.
  http: ^1.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

  # خطّ عربيّ مضمَّن في الحزمة — لا خيار تجميليّ.
  #
  # خطّ Flutter الافتراضي (Roboto) **لا يحوي حرفًا عربيًّا واحدًا**، فيرسم كل
  # نصّ مربّعاتٍ فارغة (▯▯▯). ولا يمسك ذلك محلّلٌ ولا اختبارُ وحدة — يمسكه من
  # يفتح التطبيق. وعلى الويب لا يوجد «خطّ نظام» يُتّكل عليه.
  #
  # وCairo خطٌّ برخصة OFL يجوز تضمينه، ومصمَّمٌ لواجهات عربية لا لنصوص مطبوعة.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
